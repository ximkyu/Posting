[pytest]
# Tests liegen in tests/, laufen immer offline (kein YouTube-Zugriff)
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning:googleapiclient.*
    ignore::DeprecationWarning:google.*
markers =
    slow: laenger laufende Tests (Hintergrund-Threads)
